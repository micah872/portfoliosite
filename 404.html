<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f0d">
  <title>404 — micah gao</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='3' y='3' width='58' height='58' fill='%23f5f5f5' stroke='%230a0a0a' stroke-width='4'/><text x='32' y='49' font-family='Courier New, Courier, monospace' font-size='52' font-weight='700' text-anchor='middle' fill='%230a0a0a'>m</text></svg>">
  <script>
    /* set theme before first paint to avoid flash */
    (function () {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'dark') t = 'dark';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', t === 'dark' ? '#0f0f0d' : '#fafafa');
    })();
  </script>
  <style>
    :root {
      --bg: #0f0f0d;
      --fg: #f0eee8;
      --fg-soft: #a8a49a;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #fafafa;
      --fg: #0a0a0a;
      --fg-soft: #555;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Courier New', Courier, ui-monospace, monospace;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { text-align: center; }
    h1 { font-size: clamp(48px, 10vw, 96px); margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: var(--fg-soft); margin: 0 0 24px; }
    a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
    a:hover { opacity: 0.55; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>this page doesn't exist.</p>
    <a href="/">back home</a>
  </main>
</body>
</html>
