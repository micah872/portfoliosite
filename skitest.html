<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>skitest</title>
  <script>
    /* mode comes from the URL so each strategy loads with the right meta from first paint */
    var MODE = new URLSearchParams(location.search).get('mode') || 'a';
    if (!/^[abcd]$/.test(MODE)) MODE = 'a';
    document.documentElement.className = 'mode-' + MODE;
    if (MODE === 'c') {
      document.querySelector('meta[name="viewport"]')
        .setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover');
    }
  </script>
  <style>
    :root { background: #0f0f0d; }
    body {
      margin: 0;
      position: relative;
      background: #0f0f0d;
      color: #f0eee8;
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.6;
    }

    #rail {
      left: 0; right: 0;
      height: 44px;
      z-index: 500;
      border-bottom: 1px solid #555;
    }
    #rail .skier { position: absolute; bottom: 2px; left: 12px; font-size: 26px; line-height: 1; z-index: 2; }
    #rail .bg { display: none; }

    /* A — baseline: what the live site does today (fixed, 44px) */
    .mode-a #rail { position: fixed; top: 0; background: #0f0f0d; }
    .mode-a body { padding-top: 44px; }

    /* B — sticky rail with an upward bleed painted in the scroll layer.
       If B works, the strip above the rail turns MAROON. */
    .mode-b #rail { position: sticky; top: 0; background: #0f0f0d; }
    .mode-b #rail::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      bottom: 100%;
      height: 150px;
      background: #5a1e1e;
    }

    /* C — viewport-fit=cover + env() height + absolute child carrying the
       background (Safari 26 sampling pattern). If C works, the whole
       rail area up to the island turns GREEN. */
    .mode-c #rail { position: fixed; top: 0; height: calc(44px + env(safe-area-inset-top, 0px)); background: transparent; }
    .mode-c #rail .bg { display: block; position: absolute; inset: 0; background: #1e4632; }
    .mode-c body { padding-top: calc(44px + env(safe-area-inset-top, 0px)); }

    /* D — fixed rail + JS-chased cover riding just above the scroll position.
       If D works, the strip above the rail turns PURPLE. */
    .mode-d #rail { position: fixed; top: 0; background: #0f0f0d; }
    .mode-d body { padding-top: 44px; }
    #chase { display: none; }
    .mode-d #chase {
      display: block;
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 250px;
      background: #3d2a5e;
      z-index: 499;
      will-change: transform;
    }

    #probe { position: fixed; top: 0; left: -10px; width: 1px; height: env(safe-area-inset-top, 0px); visibility: hidden; }

    #panel {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 600;
      background: #1c1a17;
      border: 1px solid #555;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
    }
    #panel a {
      display: inline-block;
      color: #f0eee8;
      text-decoration: none;
      border: 1px solid #777;
      border-radius: 6px;
      padding: 6px 14px;
      margin: 0 3px;
      font-weight: 700;
    }
    #panel a.on { background: #e06055; border-color: #e06055; color: #0f0f0d; }
    #readout { margin-top: 6px; color: #a8a49a; font-size: 12px; }

    main { padding: 12px 18px 400px; }
    main p { margin: 0 0 4px; }
  </style>
</head>
<body>

  <div id="rail">
    <div class="bg"></div>
    <span class="skier">⛷️</span>
  </div>
  <div id="chase"></div>
  <div id="probe"></div>

  <main id="content">
    <p><strong>skitest — scroll down until the Safari toolbar collapses, then look at the Dynamic Island area.</strong></p>
    <p>A = current live behavior. B = maroon strip if it works. C = green rail if it works. D = purple strip if it works.</p>
  </main>

  <div id="panel">
    <a href="?mode=a" id="btn-a">A</a>
    <a href="?mode=b" id="btn-b">B</a>
    <a href="?mode=c" id="btn-c">C</a>
    <a href="?mode=d" id="btn-d">D</a>
    <div id="readout"></div>
  </div>

  <script>
    document.getElementById('btn-' + MODE).className = 'on';

    var mainEl = document.getElementById('content');
    for (var i = 1; i <= 150; i++) {
      var p = document.createElement('p');
      p.textContent = 'line ' + String(i).padStart(3, '0') + ' — the quick brown fox jumps over the lazy dog';
      mainEl.appendChild(p);
    }

    var chase = document.getElementById('chase');
    function onScroll() {
      requestAnimationFrame(function () {
        if (MODE === 'd') {
          /* keep the cover's bottom overlapping the rail: spans [scrollY-206, scrollY+44] */
          chase.style.transform = 'translateY(' + (window.scrollY - 206) + 'px)';
        }
        readout();
      });
    }

    var ro = document.getElementById('readout');
    function readout() {
      var envTop = getComputedStyle(document.getElementById('probe')).height;
      var vv = window.visualViewport;
      ro.textContent = 'mode ' + MODE.toUpperCase()
        + ' · env-top ' + envTop
        + ' · scrollY ' + Math.round(window.scrollY)
        + (vv ? ' · vvTop ' + Math.round(vv.offsetTop) : '');
    }
    addEventListener('scroll', onScroll, { passive: true });
    setInterval(readout, 500);
    onScroll();
  </script>
</body>
</html>
